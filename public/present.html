<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Class Poll — Class view</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap present">
  <div class="card" id="gate" style="max-width:520px;">
    <label for="key">Instructor key</label>
    <input type="password" id="key" placeholder="Enter the instructor key" autocomplete="off" />
    <button id="unlockBtn">Unlock</button>
    <div class="status error" id="gateError"></div>
  </div>

  <div id="main" style="display:none;">
    <div class="ctl" id="controls" style="justify-content:space-between;">
      <div><label for="pollSel">Statement</label><select id="pollSel"></select></div>
      <div class="row">
        <button class="secondary" id="backBtn" type="button">← Back</button>
        <button id="nextBtn" type="button">Show what lines up</button>
        <button class="secondary" id="allBtn" type="button">Show all</button>
        <button class="secondary" id="hideBtn" type="button">Hide</button>
      </div>
    </div>

    <div id="stage">
      <div class="card">
        <span class="pill closed" id="pollLabel"></span>
        <h1 id="statement" style="font-size:1.8em;margin:8px 0 0;"></h1>
        <div id="histo"></div>
        <div class="status" id="histoNote"></div>
      </div>

      <div id="connections" style="display:none;">
        <div class="card">
          <h2 class="conn-title">What lines up with this?</h2>
          <div class="conn-count" id="connCount"></div>
          <div id="connBody"></div>
          <div id="connKey"></div>
        </div>
        <div class="card talk" id="guide"></div>
      </div>
    </div>
    <div class="banner info" id="notReady" style="display:none;"></div>
  </div>
</div>
<script src="/common.js"></script>
<script src="/render.js"></script>
<script src="/page-present.js"></script>
</body>
</html>
